# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in src/Jobcelis/Jobcelis.csproj when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into src/Jobcelis/Jobcelis.csproj and commits it locally
#   3. packs it and publishes it to NuGet
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in src/Jobcelis/Jobcelis.csproj.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(grep -m1 -oE '<Version>[^<]+' src/Jobcelis/Jobcelis.csproj | sed 's/<Version>//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" src/Jobcelis/Jobcelis.csproj

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          MISSING=""
          [ -n "$NUGET_API_KEY" ] || MISSING="$MISSING NUGET_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -s "https://api.nuget.org/v3-flatcontainer/jobcelis/index.json" | grep -q "\"${{ steps.v.outputs.version }}\""; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.check.outputs.release == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        if: steps.check.outputs.release == 'true'
        run: dotnet pack src/Jobcelis/Jobcelis.csproj -c Release -o ./nupkg

      - name: Publish to NuGet
        if: steps.check.outputs.release == 'true'
        run: dotnet nuget push ./nupkg/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
